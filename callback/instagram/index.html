<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Signing in</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <p>Sending the Instagram sign-in to the clip tool on this PC.</p>
    <p>If nothing happens, the clip tool isn't running.</p>
    <script>
        // Instagram only sends sign-ins to https pages, so this page passes the code on to the tool running locally
        location.replace('http://127.0.0.1:8710/api/posting/instagram/callback' + location.search);
    </script>
</body>
</html>
